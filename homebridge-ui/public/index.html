<!--
  Settings page shown inside the Homebridge UI.

  Runs in an iframe the host provides; `homebridge.*` is injected by it. The
  host supplies Bootstrap and the active theme, so styling stays minimal.

  The scan panel sits above the ordinary form rather than replacing it: every
  other setting is fine as a plain field, and only the address is hard to come
  by. The statistics come last, as close to the form as this page reaches: the
  host draws the form itself, below this page, and nothing here can go inside
  it.
-->
<style>
  .eliot-hidden  { display: none; }
  .eliot-hint    { font-size: .8rem; opacity: .7; }
  .eliot-msg     { margin-top: .75rem; margin-bottom: 0; font-size: .85rem; }
  .eliot-list    { margin-top: .75rem; }
  .eliot-item    { display: flex; gap: .75rem; align-items: center;
                   padding: .5rem 0; border-top: 1px solid rgba(128,128,128,.25); }
  .eliot-item:first-child { border-top: 0; }
  .eliot-grow    { flex: 1 1 auto; min-width: 0; }
  .eliot-mac     { font-family: monospace; }
  .eliot-badge   { font-size: .7rem; padding: .15rem .4rem; border-radius: .25rem;
                   background: rgba(128,128,128,.2); white-space: nowrap; }
  .eliot-yes     { background: rgba(46,158,91,.25); }
  .eliot-stats   { width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
  .eliot-stats th, .eliot-stats td { padding: .25rem .5rem .25rem 0; }
  .eliot-stats th:not(:first-child), .eliot-stats td:not(:first-child) { text-align: right; }
</style>

<div class="card mb-3">
  <div class="card-body">
    <h5 class="card-title">Find your desk</h5>
    <p class="card-text text-muted small mb-3">
      Finds the Smart Dongle by the Bluetooth service it speaks, whatever it is called.
    </p>

    <div class="d-flex gap-2 align-items-center">
      <button type="button" class="btn btn-primary" id="eliot-scan">Scan for desks</button>
      <span class="eliot-hint" id="eliot-hint"></span>
    </div>

    <p class="eliot-msg eliot-hidden" id="eliot-msg"></p>
    <div class="eliot-list" id="eliot-results"></div>
  </div>
</div>

<div class="alert alert-warning eliot-hidden" id="eliot-check" role="alert"></div>

<div class="card mb-3 eliot-hidden" id="eliot-stats-card">
  <div class="card-body">
    <h5 class="card-title">Sitting and standing</h5>
    <div id="eliot-stats"></div>
  </div>
</div>

<script>
  (async () => {
    const button  = document.getElementById('eliot-scan');
    const hint    = document.getElementById('eliot-hint');
    const message = document.getElementById('eliot-msg');
    const results = document.getElementById('eliot-results');

    await homebridge.showSchemaForm();

    /** "3:05 h" for seconds; minutes are as fine as this is worth reading. */
    const hours = (seconds) => {
      const minutes = Math.round(seconds / 60);
      return `${Math.floor(minutes / 60)}:${String(minutes % 60).padStart(2, '0')} h`;
    };
    const SPAN_NAMES = { 1: 'Today', 7: 'Last 7 days', 30: 'Last 30 days',
                         100: 'Last 100 days' };

    /**
     * Show what the plugin has counted. Hidden until there is something:
     * a desk without auto movement never has any, and an empty table would
     * only raise the question of why.
     */
    async function showStats() {
      const card = document.getElementById('eliot-stats-card');
      const box = document.getElementById('eliot-stats');
      let desks = [];
      try {
        ({ desks } = await homebridge.request('/stats'));
      } catch {
        return;
      }
      if (!desks.length) {
        return;
      }
      box.innerHTML = '';
      for (const desk of desks) {
        if (desks.length > 1) {
          const title = document.createElement('h6');
          title.className = 'mt-2';
          title.textContent = desk.name;
          box.append(title);
        }
        const table = document.createElement('table');
        table.className = 'eliot-stats';
        const head = table.createTHead().insertRow();
        for (const label of ['', 'Sitting', 'Standing', 'Standing share']) {
          const th = document.createElement('th');
          th.textContent = label;
          head.append(th);
        }
        const body = table.createTBody();
        for (const span of desk.spans) {
          const row = body.insertRow();
          const total = span.sitting + span.standing;
          const share = total > 0 ? `${Math.round((span.standing / total) * 100)} %` : '–';
          for (const text of [SPAN_NAMES[span.days] ?? `Last ${span.days} days`,
                              hours(span.sitting), hours(span.standing), share]) {
            row.insertCell().textContent = text;
          }
        }
        const note = document.createElement('p');
        note.className = 'eliot-hint mt-2 mb-0';
        note.textContent =
          `Counted only while Auto Movement is on and inside its hours. ` +
          `Standing is ${desk.thresholdMm} mm and up.`;
        box.append(table, note, resetButton(desk));
      }
      card.classList.remove('eliot-hidden');
    }

    /**
     * A button that deletes a desk's statistics, after a second click.
     *
     * Asked twice on the button itself rather than with confirm(), which the
     * host's iframe may not be allowed to show.
     */
    function resetButton(desk) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn btn-sm btn-primary mt-2';
      button.textContent = 'Reset data';
      let armed = null;
      button.addEventListener('click', async () => {
        if (!armed) {
          button.textContent = 'SURE?';
          armed = setTimeout(() => {
            armed = null;
            button.textContent = 'Reset data';
          }, 5000);
          return;
        }
        clearTimeout(armed);
        armed = null;
        button.disabled = true;
        try {
          await homebridge.request('/stats/reset', { mac: desk.mac });
          homebridge.toast.success('Counting starts again from now.', 'Data reset');
          document.getElementById('eliot-stats-card').classList.add('eliot-hidden');
          await showStats();
        } catch (error) {
          homebridge.toast.error(error.message || String(error), 'Reset failed');
          button.disabled = false;
          button.textContent = 'Reset data';
        }
      });
      return button;
    }
    void showStats();

    const check = document.getElementById('eliot-check');

    /**
     * Say what is wrong with the auto-movement settings, as they are typed.
     *
     * The schema can bound one field at a time and no more; every rule here is
     * about two fields together, which JSON Schema cannot express and the form
     * therefore cannot enforce. Without this the mistake is only discovered in
     * the Homebridge log after a restart, where nobody is looking.
     *
     * The plugin checks all of this again on load. This is the earlier, kinder
     * telling of it, not the only one.
     */
    function complaints(config) {
      const problems = [];
      for (const desk of config?.[0]?.desks ?? []) {
        const auto = desk?.autoMove;
        if (!auto) {
          continue;
        }
        const where = desk.name ? `"${desk.name}"` : 'this desk';
        const interval = Number(auto.intervalMinutes ?? 30);
        const warn = Number(auto.warnMinutes ?? 5);
        const sitting = Number(auto.sittingMm ?? 800);
        const standing = Number(auto.standingMm ?? 1200);

        if (warn > 0 && warn >= interval) {
          problems.push(
            `${where}: the warning (${warn} min) must be shorter than the interval ` +
              `(${interval} min), or it would arrive before the previous move had finished. ` +
              'Set it to 0 to turn the warning off.',
          );
        }
        if (sitting >= standing) {
          problems.push(
            `${where}: the sitting height (${sitting} mm) must be below the standing one ` +
              `(${standing} mm).`,
          );
        }
        for (const window of auto.windows ?? []) {
          if (!/^\s*\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}\s*$/.test(String(window))) {
            problems.push(`${where}: "${window}" is not a time range like 08:00-12:00.`);
          }
        }
      }
      return problems;
    }

    function review(config) {
      const problems = complaints(config);
      check.textContent = problems.join(' ');
      check.classList.toggle('eliot-hidden', problems.length === 0);
    }

    try {
      review(await homebridge.getPluginConfig());
      // Not every host version emits this; the check is a nicety, and the
      // plugin's own validation is what actually keeps a bad value out.
      homebridge.addEventListener?.('configChanged', (event) => review(event?.data));
    } catch {
      check.classList.add('eliot-hidden');
    }

    const say = (text, kind) => {
      message.textContent = text;
      message.className = `eliot-msg text-${kind}`;
    };

    /** Put an address into the config, adding a desk entry if there is none. */
    async function use(found) {
      const config = await homebridge.getPluginConfig();
      const block = config[0] ?? { platform: 'EliotSmartControl' };
      block.desks = Array.isArray(block.desks) ? block.desks : [];

      const existing = block.desks.find((d) => (d.mac || '').toUpperCase() === found.address);
      if (existing) {
        say(`${found.address} is already configured as "${existing.name}".`, 'muted');
        return;
      }

      // Reuse a half-filled entry rather than adding a second one beside it:
      // someone who opened the form, typed a name and then scanned means that
      // entry, not a new one.
      const blank = block.desks.find((d) => !d.mac);
      if (blank) {
        blank.mac = found.address;
        blank.name = blank.name || found.name || 'Desk';
      } else {
        block.desks.push({ name: found.name || 'Desk', mac: found.address });
      }

      await homebridge.updatePluginConfig([block, ...config.slice(1)]);
      await homebridge.savePluginConfig();

      // The form renders from the config it was given, so it has to be rebuilt
      // to show the address that was just written into it.
      homebridge.hideSchemaForm();
      await homebridge.showSchemaForm();
      say(`Added ${found.address}. Restart Homebridge to connect to it.`, 'success');
    }

    function render(found, others) {
      results.innerHTML = '';
      if (!found.length) {
        say(
          'No desks found. If the Eliot app on your phone is connected, close it and turn ' +
            'Bluetooth off there — the dongle takes one connection at a time and will not ' +
            'advertise while something holds it. Then unplug it for five seconds.',
          'warning',
        );
        return;
      }

      for (const desk of found) {
        const row = document.createElement('div');
        row.className = 'eliot-item';

        const left = document.createElement('div');
        left.className = 'eliot-grow';
        const title = document.createElement('div');
        title.innerHTML =
          `<span class="eliot-mac">${desk.address}</span>` +
          (desk.name ? ` &mdash; ${desk.name}` : '');
        const sub = document.createElement('div');
        sub.className = 'eliot-hint';
        const bits = [];
        bits.push(desk.confirmed ? 'confirmed desk' : 'not confirmed');
        bits.push(desk.rssi == null ? 'signal unknown' : `${desk.rssi} dBm`);
        if (desk.connected) {
          bits.push('in use — already connected, by this plugin or a phone');
        }
        if (desk.rssi != null && desk.rssi < -85) {
          bits.push('very weak: expect it to drop');
        }
        sub.textContent = bits.join(' · ');
        left.append(title, sub);

        const badge = document.createElement('span');
        badge.className = `eliot-badge${desk.confirmed ? ' eliot-yes' : ''}`;
        badge.textContent = desk.confirmed ? 'desk' : '?';

        const pick = document.createElement('button');
        pick.type = 'button';
        pick.className = 'btn btn-sm btn-outline-primary';
        pick.textContent = 'Use this';
        pick.addEventListener('click', () => void use(desk));

        row.append(badge, left, pick);
        results.append(row);
      }

      say(
        `${found.length} candidate${found.length === 1 ? '' : 's'}` +
          (others ? `, plus ${others} unnamed devices ignored.` : '.'),
        'muted',
      );
    }

    button.addEventListener('click', async () => {
      button.disabled = true;
      results.innerHTML = '';
      hint.textContent = 'Scanning …';
      homebridge.showSpinner();
      say('Looking for desks. Anything already connected to a phone will not appear.', 'muted');
      try {
        const { desks, others } = await homebridge.request('/scan', { seconds: 12 });
        render(desks, others);
      } catch (error) {
        say(error.message || String(error), 'danger');
      } finally {
        homebridge.hideSpinner();
        hint.textContent = '';
        button.disabled = false;
      }
    });
  })();
</script>
