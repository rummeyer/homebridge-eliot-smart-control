# Build and test on every supported Node.js version.
#
# Homebridge verification requires that a plugin run on all supported LTS
# versions of Node.js. This demonstrates that rather than asserting it: a
# version that stops working fails here instead of reaching a user.
#
# The matrix mirrors `engines.node` in package.json. Keep the two in step.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    name: Node ${{ matrix.node-version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # None of this needs a desk or a Bluetooth adapter: the transport
      # reports an unreachable D-Bus rather than throwing, and every unit
      # under test takes its transport as a dependency.
      - name: Test
        run: npm test

      - name: Check what would be published
        run: npm pack --dry-run
