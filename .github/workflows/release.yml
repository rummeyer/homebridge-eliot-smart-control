name: Release

# Publishing is deliberately tied to a tag rather than to a push on main, so
# that it takes a decision rather than a merge.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For npm provenance, which links the published tarball to the commit
      # and workflow that built it. Requires the repository to be public;
      # drop --provenance below while it is private.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # prepublishOnly does this too; running it here means a failure shows up
      # as a failed test rather than as a failed publish.
      - run: npm test

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg" >&2
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
