name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions package.json says it supports, and nothing else.
        node: ['22.18', '24', '26']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build and test
        # No Bluetooth here, and none needed: the transport reports an
        # unreachable D-Bus rather than throwing, and every unit under test
        # takes its transport as a dependency.
        run: npm test

      - name: Check the published package
        run: npm pack --dry-run
